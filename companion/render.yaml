# Render's free web service. Any host that can build a Dockerfile works the
# same way — Fly, Koyeb, Railway — since everything that differs is an
# environment variable.
services:
  - type: web
    name: music-hub-companion
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    rootDir: companion
    healthCheckPath: /health
    envVars:
      # Generate with: openssl rand -hex 32
      - key: MUSIC_HUB_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://music-hub-xaviel.vercel.app,http://localhost:4200,https://localhost
      - key: MAX_DURATION_SECONDS
        value: "1800"
