name: Release APK

# Cutting a release used to mean a local gradle run, which meant the APK came
# from whichever machine happened to be to hand — and an APK signed with the
# wrong key cannot be installed over the old one at all.
on:
  push:
    tags: ['v*']
  # Re-run for a tag that already exists, after fixing something.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.5.1)'
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      # Capacitor 8's CLI refuses to run on anything below Node 22, and the
      # failure is at `cap sync` — after the build, before the signing — which
      # is a slow place to find out.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Capacitor 8 needs exactly JDK 21: 17 cannot compile capacitor-android,
      # and Gradle 8.14 cannot run on 25.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Unit tests
        run: |
          export CHROME_BIN=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          npx ng test --watch=false --browsers=ChromeHeadlessCI

      - name: Check the tag matches the version in the build
        run: |
          IN_APP=$(node -p "require('./package.json').version")
          if [ "v$IN_APP" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json ($IN_APP)."
            echo "The updater compares the running version against the latest tag;"
            echo "shipping them out of step means the app either nags forever or"
            echo "never notices. Run ./tools/set-version.sh before tagging."
            exit 1
          fi

      - run: npm run build
      - run: npx cap sync android

      # The keystore lives only in secrets. Written outside the workspace so it
      # cannot be picked up by anything that archives the checkout.
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MUSICHUB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::MUSICHUB_KEYSTORE_BASE64 is not set — see README, 'Releasing from CI'."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"

      - name: Build the signed APK
        env:
          STORE_PASSWORD: ${{ secrets.MUSICHUB_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MUSICHUB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MUSICHUB_KEY_PASSWORD }}
        working-directory: android
        # Passed as -P rather than written to gradle.properties: a file would
        # outlive the step, and these are the keys to every future update.
        run: |
          ./gradlew assembleRelease \
            -PMUSICHUB_STORE_FILE="$RUNNER_TEMP/keystore/release.jks" \
            -PMUSICHUB_STORE_PASSWORD="$STORE_PASSWORD" \
            -PMUSICHUB_KEY_ALIAS="$KEY_ALIAS" \
            -PMUSICHUB_KEY_PASSWORD="$KEY_PASSWORD"

      # An APK signed with a different key installs nowhere: Android refuses
      # the upgrade and the only way out is uninstalling, which takes the
      # downloads with it. Cheaper to fail here.
      - name: Check it is signed with the same key as every other release
        env:
          EXPECTED: ${{ vars.MUSICHUB_CERT_SHA256 }}
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs \
            android/app/build/outputs/apk/release/app-release.apk \
            | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}')
          echo "signing certificate: $ACTUAL"
          if [ -z "$EXPECTED" ]; then
            echo "::warning::Set the repository variable MUSICHUB_CERT_SHA256 to $ACTUAL to have this checked."
          elif [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Signed with the wrong key. Expected $EXPECTED, got $ACTUAL."
            exit 1
          fi

      # That exact filename is what the in-app updater looks for, and what the
      # portfolio's download button points at.
      - name: Name it what the updater expects
        run: cp android/app/build/outputs/apk/release/app-release.apk music-hub.apk

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" music-hub.apk --clobber
            echo "Attached to the existing $TAG release."
          else
            # A draft, deliberately: the release body is what the app shows as
            # its update notes, and an empty one published automatically would
            # reach every phone before anyone had written it.
            gh release create "$TAG" music-hub.apk --draft --title "Music Hub $TAG" \
              --notes "_Notes still to write._ The APK is attached; publish when this reads the way you want it to."
            echo "Created a draft release for $TAG — add the notes and publish it."
          fi
