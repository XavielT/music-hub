name: CI

# Every push and pull request. The suite is the only thing standing between a
# refactor and somebody's library, so it runs before anything is merged.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The runner image ships Chrome, but karma has to be told where it is,
      # and the CI launcher drops the sandbox for runners that are root.
      - name: Unit tests
        run: |
          export CHROME_BIN=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          npx ng test --watch=false --browsers=ChromeHeadlessCI

      - name: Production build
        run: npm run build

  # The Angular suite cannot see the Python service at all, so at minimum every
  # push should prove it still imports and its endpoints are wired.
  companion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # httpx is only needed by Starlette's TestClient, so it is a CI
      # dependency rather than a runtime one.
      - run: pip install -r requirements.txt httpx

      - name: It imports, and refuses to serve without a token
        env:
          MUSIC_HUB_TOKEN: ''
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          import app

          client = TestClient(app.app)

          health = client.get("/health")
          assert health.status_code == 200, health.text
          assert health.json()["configured"] is False, health.text

          # No token configured: everything else is refused rather than open.
          for path in ("/search?q=x", "/download?id=abcdefghijk"):
              assert client.get(path).status_code == 503, path

          print("companion ok — yt-dlp", health.json()["ytdlp"])
          PY

      - name: With a token, it authenticates
        env:
          MUSIC_HUB_TOKEN: ci-token
        run: |
          python - <<'PY'
          import importlib
          from fastapi.testclient import TestClient
          import app

          importlib.reload(app)
          client = TestClient(app.app)

          assert client.get("/search?q=x").status_code == 401
          assert client.get("/search?q=x", headers={"Authorization": "Bearer wrong"}).status_code == 401
          # A malformed id is rejected before yt-dlp is ever asked.
          bad = client.get("/download?id=nope", headers={"Authorization": "Bearer ci-token"})
          assert bad.status_code == 422, bad.text

          print("auth ok")
          PY
