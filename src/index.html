<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <title>Music Hub</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0d0d0d">
  <!-- Chrome's auto-translate rewrites every text node (wrapping them in
       <font> tags), which detaches Angular's interpolation bindings: the UI
       then freezes at the translated text while the app keeps running. The
       app is English-only, so opt out of translation entirely. -->
  <meta name="google" content="notranslate">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>
</body>
</html>
