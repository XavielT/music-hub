<div class="app-shell">
  <main class="app-content">
    <router-outlet></router-outlet>
  </main>
  <!-- Player and navigation only exist once you are signed in, and never on
       the auth pages -->
  <ng-container *ngIf="showChrome()">
    <app-player-bar></app-player-bar>
    <app-bottom-nav></app-bottom-nav>
  </ng-container>
  <!-- A newer version is available (a cached build on the web, a GitHub
       release on Android). -->
  <app-update-banner></app-update-banner>
  <app-toast></app-toast>
</div>
