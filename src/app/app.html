<div class="app-shell">
  <main class="app-content">
    <router-outlet></router-outlet>
  </main>
  <!-- Player and navigation only exist once you are signed in, and never on
       the auth pages -->
  <ng-container *ngIf="showChrome()">
    <app-player-bar></app-player-bar>
    <app-bottom-nav></app-bottom-nav>
  </ng-container>
  <!-- A newer build is cached and takes effect on reload. -->
  <div class="app-update" *ngIf="pwa.updateReady()">
    <span>A new version is ready.</span>
    <button (click)="pwa.applyUpdate()">Reload</button>
  </div>
  <app-toast></app-toast>
</div>
