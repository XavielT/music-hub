<div class="auth">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="auth-brand-icon">♫</span>
      <h1 class="auth-brand-name">New password</h1>
      <p class="auth-brand-tagline">Pick something you'll remember this time.</p>
    </div>

    <form class="auth-form" *ngIf="ready()" (ngSubmit)="submit()">
      <input
        class="auth-input"
        type="password"
        name="password"
        autocomplete="new-password"
        placeholder="New password"
        [(ngModel)]="password"
      />
      <input
        class="auth-input"
        type="password"
        name="confirm"
        autocomplete="new-password"
        placeholder="Repeat new password"
        [(ngModel)]="confirm"
      />

      <p class="auth-error" *ngIf="error()">{{ error() }}</p>
      <p class="auth-notice" *ngIf="notice()">{{ notice() }}</p>

      <button class="auth-submit" type="submit" [disabled]="busy()">
        {{ busy() ? 'Saving...' : 'Save password' }}
      </button>
    </form>

    <div class="auth-form" *ngIf="!ready()">
      <p class="auth-error">{{ error() }}</p>
      <button class="auth-submit" type="button" (click)="backToSignIn()">Back to sign in</button>
    </div>
  </div>
</div>
