<div class="auth">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="auth-brand-icon">♫</span>
      <h1 class="auth-brand-name">{{ 'auth.newPassword' | t }}</h1>
      <p class="auth-brand-tagline">{{ 'auth.newPasswordTagline' | t }}</p>
    </div>

    <form class="auth-form" *ngIf="ready()" (ngSubmit)="submit()">
      <input
        class="auth-input"
        type="password"
        name="password"
        autocomplete="new-password"
        [placeholder]="'auth.newPassword' | t"
        [(ngModel)]="password"
      />
      <input
        class="auth-input"
        type="password"
        name="confirm"
        autocomplete="new-password"
        [placeholder]="'auth.repeatNewPassword' | t"
        [(ngModel)]="confirm"
      />

      <p class="auth-error" *ngIf="error()">{{ error() }}</p>
      <p class="auth-notice" *ngIf="notice()">{{ notice() }}</p>

      <button class="auth-submit" type="submit" [disabled]="busy()">
        {{ busy() ? ('common.saving' | t) : ('auth.savePassword' | t) }}
      </button>
    </form>

    <div class="auth-form" *ngIf="!ready()">
      <p class="auth-error">{{ error() }}</p>
      <button class="auth-submit" type="button" (click)="backToSignIn()">{{ 'auth.backToSignIn' | t }}</button>
    </div>
  </div>
</div>
