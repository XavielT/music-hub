<div class="auth">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="auth-brand-icon">♫</span>
      <h1 class="auth-brand-name">Music Hub</h1>
      <p class="auth-brand-tagline">{{ 'auth.tagline' | t }}</p>
    </div>

    <div class="auth-tabs" *ngIf="mode() !== 'forgot'">
      <button class="auth-tab" [class.active]="mode() === 'login'" (click)="setMode('login')">{{ 'auth.signIn' | t }}</button>
      <button class="auth-tab" [class.active]="mode() === 'register'" (click)="setMode('register')">{{ 'auth.register' | t }}</button>
    </div>

    <form class="auth-form" (ngSubmit)="submit()">
      <p class="auth-hint" *ngIf="mode() === 'forgot'">{{ 'auth.forgotHint' | t }}</p>
      <p class="auth-invited" *ngIf="mode() === 'register' && inviteToken()">{{ 'auth.invited' | t }}</p>
      <p class="auth-hint" *ngIf="mode() === 'register' && !inviteToken()">{{ 'auth.inviteHint' | t }}</p>

      <input
        class="auth-input"
        type="email"
        name="email"
        autocomplete="email"
        [placeholder]="'auth.email' | t"
        [(ngModel)]="email"
      />

      <input
        class="auth-input"
        *ngIf="mode() === 'register'"
        type="text"
        name="displayName"
        autocomplete="name"
        [placeholder]="'auth.displayName' | t"
        [(ngModel)]="displayName"
      />

      <input
        class="auth-input"
        *ngIf="mode() !== 'forgot'"
        type="password"
        name="password"
        [attr.autocomplete]="mode() === 'login' ? 'current-password' : 'new-password'"
        [placeholder]="'auth.password' | t"
        [(ngModel)]="password"
      />

      <p class="auth-error" *ngIf="error()">{{ error() }}</p>
      <p class="auth-notice" *ngIf="notice()">{{ notice() }}</p>

      <button class="auth-submit" type="submit" [disabled]="busy()">{{ submitLabel() }}</button>

      <button class="auth-link" type="button" *ngIf="mode() === 'login'" (click)="setMode('forgot')">
        {{ 'auth.forgotPassword' | t }}
      </button>
      <button class="auth-link" type="button" *ngIf="mode() === 'forgot'" (click)="setMode('login')">
        {{ 'auth.backToSignIn' | t }}
      </button>
    </form>

    <p class="auth-switch" *ngIf="mode() === 'login'">
      {{ 'auth.noAccount' | t }}
      <button (click)="setMode('register')">{{ 'auth.register' | t }}</button>
    </p>
    <p class="auth-switch" *ngIf="mode() === 'register'">
      {{ 'auth.haveAccount' | t }}
      <button (click)="setMode('login')">{{ 'auth.signIn' | t }}</button>
    </p>

    <!-- Installing before signing in is the natural order on iPhone, so the
         hint belongs here too, not only behind the login. -->
    <app-install-hint></app-install-hint>
  </div>
</div>
