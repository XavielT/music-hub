<div class="playlist-details" *ngIf="playlist() as p">
  <button class="playlist-details__back" (click)="back()">‹ {{ 'common.back' | t }}</button>

  <!-- Header -->
  <header class="playlist-details__header">
    <div class="playlist-details__cover">
      <app-cover [name]="p.name" [color]="p.coverColor"></app-cover>
    </div>
    <div class="playlist-details__meta">
      <h1 class="playlist-details__name">{{ p.name }}</h1>
      <p class="playlist-details__count">
        {{ 'common.songs' | t: { count: p.songIds.length } }}
        <span class="playlist-details__by" *ngIf="library.playlistOwnerLabel(p) as who">
          · {{ 'playlist.sharedBy' | t: { name: who } }}
        </span>
      </p>
      <div class="playlist-details__actions">
        <button class="playlist-details__play" (click)="playAll()" [disabled]="songs().length === 0">▶ {{ 'common.play' | t }}</button>
        <button
          class="playlist-details__shuffle"
          (click)="shuffleAll()"
          [disabled]="songs().length === 0"
          [title]="'playlist.shuffleTitle' | t"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z" />
          </svg>
          {{ 'common.shuffle' | t }}
        </button>
        <button
          class="playlist-details__download"
          (click)="downloadAll()"
          [disabled]="sync.uploading() || offlineCount() === songs().length"
          [title]="'playlist.downloadAllTitle' | t"
        >
          {{ offlineCount() === songs().length && songs().length > 0 ? '✓ ' + ('playlist.offline' | t) : '⬇ ' + ('playlist.download' | t) }}
        </button>
        <button
          class="playlist-details__share"
          *ngIf="library.canManagePlaylist(p)"
          [class.on]="p.isShared"
          (click)="toggleShared()"
          [title]="p.isShared ? ('playlist.stopSharing' | t) : ('playlist.startSharing' | t)"
        >
          {{ p.isShared ? '✓ ' + ('playlist.shared' | t) : ('playlist.share' | t) }}
        </button>
        <button
          class="playlist-details__delete"
          *ngIf="library.canManagePlaylist(p)"
          (click)="deletePlaylist()"
        >
          {{ 'common.delete' | t }}
        </button>
      </div>
      <p class="playlist-details__hint" *ngIf="p.isShared && library.canManagePlaylist(p)">
        {{ 'playlist.ownerHint' | t }}
      </p>
      <p class="playlist-details__hint" *ngIf="!library.canManagePlaylist(p)">
        {{ 'playlist.guestHint' | t }}
      </p>
    </div>
  </header>

  <!-- Songs -->
  <div class="playlist-details__body">
    <app-song-item
      *ngFor="let song of songs()"
      [song]="song"
      [active]="player.current()?.id === song.id"
      [canAddToPlaylist]="false"
      (play)="player.play(song, songs())"
      (addToQueue)="player.addToQueue(song)"
      (playNext)="player.playNext(song)"
      (edit)="editing.set(song)"
      (remove)="library.removeFromPlaylist(p.id, song.id)"
      [canUpload]="auth.canAddToLibrary()"
      (upload)="sync.uploadOne(song)"
      (download)="library.downloadSong(song)"
      (removeDownload)="library.removeDownload(song)"
    ></app-song-item>
    <p class="playlist-details__empty" *ngIf="songs().length === 0">
      {{ 'playlist.empty' | t }}
    </p>
  </div>

  <!-- Edit info -->
  <app-song-editor
    *ngIf="editing() as song"
    [song]="song"
    (closed)="editing.set(null)"
  ></app-song-editor>
</div>
