<div class="invites" *ngIf="auth.isAdmin()">
  <p class="invites-note">
    {{ 'invites.note' | t }}
  </p>

  <div class="invites-add">
    <input
      type="email"
      placeholder="name@example.com"
      autocomplete="off"
      [(ngModel)]="email"
      (keyup.enter)="add()"
    />
    <input type="text" [placeholder]="'invites.whoIsIt' | t" [(ngModel)]="note" (keyup.enter)="add()" />
    <button (click)="add()" [disabled]="invites.busy() || !email.trim()">{{ 'admin.invite' | t }}</button>
  </div>

  <p class="invites-note" *ngIf="invites.loading()">{{ 'invites.loading' | t }}</p>

  <div class="invites-row" *ngFor="let invite of invites.invites()">
    <span class="invites-who">
      <strong>{{ invite.email }}</strong>
      <em *ngIf="invite.note">{{ invite.note }}</em>
    </span>
    <span class="invites-state" [class.joined]="invite.has_joined">
      {{ invite.has_joined ? ('invites.joined' | t) : ('invites.notYet' | t) }}
    </span>
    <button
      class="invites-remove"
      [class.confirming]="confirming() === invite.email"
      (click)="remove(invite.email)"
      [disabled]="invites.busy()"
      [title]="
        invite.has_joined ? ('invites.withdrawJoined' | t) : ('invites.withdrawWaiting' | t)
      "
    >
      {{ confirming() === invite.email ? ('common.confirm' | t) : ('admin.withdraw' | t) }}
    </button>
  </div>

  <p class="invites-note" *ngIf="!invites.loading() && invites.invites().length === 0">
    {{ 'invites.emptyWarning' | t }}
  </p>

  <p class="invites-note">
    {{ 'invites.footnote' | t }}
  </p>
</div>
