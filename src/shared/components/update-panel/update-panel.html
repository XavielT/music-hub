<div class="update-panel">
  <div class="update-panel-row">
    <span class="update-panel-label">Music Hub {{ update.currentVersion() }}</span>
    <button
      class="update-panel-check"
      (click)="update.check()"
      [disabled]="update.status() === 'checking' || update.status() === 'downloading'"
    >
      {{ update.status() === 'checking' ? ('update.checking' | t) : ('update.checkForUpdates' | t) }}
    </button>
  </div>

  <ng-container *ngIf="update.available() as found">
    <p class="update-panel-found" *ngIf="update.status() !== 'idle' && update.status() !== 'checking'">
      <ng-container *ngIf="found.version">
        {{ 'update.versionAvailable' | t: { version: found.version } }}<ng-container
          *ngIf="found.sizeBytes"
        >
          — {{ update.formatSize(found.sizeBytes) }}</ng-container
        >.
      </ng-container>
      <ng-container *ngIf="!found.version">{{ 'update.newerBuild' | t }}</ng-container>
    </p>

    <pre class="update-panel-notes" *ngIf="found.notes">{{ found.notes }}</pre>

    <button
      class="update-panel-apply"
      (click)="update.apply()"
      [disabled]="update.status() === 'downloading'"
      *ngIf="update.status() === 'available' || update.status() === 'downloading' || update.status() === 'ready'"
    >
      {{ update.actionLabel() }}
    </button>

    <div class="update-panel-bar" *ngIf="update.status() === 'downloading' && update.progress() >= 0">
      <div class="update-panel-bar-fill" [style.width.%]="update.progress()"></div>
    </div>
  </ng-container>

  <p class="update-panel-error" *ngIf="update.error()">{{ update.error() }}</p>
</div>
