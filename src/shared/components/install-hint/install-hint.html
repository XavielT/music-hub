<div class="install-hint" *ngIf="visible()">
  <span class="install-hint-title">{{ 'install.title' | t }}</span>

  <!-- iOS: no install API, so spell out the Share-sheet route. -->
  <p class="install-hint-steps" *ngIf="showIosSteps()">
    <span [innerHTML]="'install.iosSteps' | t"></span>
  </p>

  <button class="install-hint-btn" *ngIf="showInstallButton()" (click)="pwa.promptInstall()">
    {{ 'install.install' | t }}
  </button>
</div>
